<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-black text-white min-h-[100dvh] flex items-center justify-center sm:p-4 select-none"
  >
    <main
      class="w-full max-w-[390px] h-[100dvh] sm:h-auto flex flex-col justify-end p-4 sm:p-6 sm:rounded-[3rem] sm:border sm:border-neutral-800"
    >
      <div class="flex-1 flex items-end justify-end pb-4 px-2 min-h-[120px]">
        <input
          type="text"
          id="display"
          value="0"
          readonly
          class="w-full bg-transparent text-right text-6xl sm:text-7xl font-light text-white tracking-tight focus:outline-none"
        />
      </div>

      <div id="Buttons" class="grid grid-cols-4 gap-3 sm:gap-3.5 pb-2">
        <button
          class="btn aspect-square bg-[#a5a5a5] active:bg-[#d4d4d2] text-black rounded-full text-2xl sm:text-3xl font-medium transition"
        >
          AC
        </button>
        <button
          class="btn aspect-square bg-[#a5a5a5] active:bg-[#d4d4d2] text-black rounded-full text-2xl sm:text-3xl font-medium transition"
        >
          +/-
        </button>
        <button
          class="btn aspect-square bg-[#a5a5a5] active:bg-[#d4d4d2] text-black rounded-full text-2xl sm:text-3xl font-medium transition"
        >
          %
        </button>
        <button
          class="btn aspect-square bg-[#ff9f0a] active:bg-[#fbc78d] text-white rounded-full text-3xl sm:text-4xl font-normal transition"
        >
          /
        </button>

        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          7
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          8
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          9
        </button>
        <button
          class="btn aspect-square bg-[#ff9f0a] active:bg-[#fbc78d] text-white rounded-full text-3xl sm:text-4xl font-normal transition"
        >
          *
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          4
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          5
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          6
        </button>
        <button
          class="btn aspect-square bg-[#ff9f0a] active:bg-[#fbc78d] text-white rounded-full text-3xl sm:text-4xl font-normal transition"
        >
          -
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          1
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          2
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          3
        </button>
        <button
          class="btn aspect-square bg-[#ff9f0a] active:bg-[#fbc78d] text-white rounded-full text-3xl sm:text-4xl font-normal transition"
        >
          +
        </button>
        <button
          class="btn col-span-2 bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal text-left pl-7 sm:pl-8 transition"
        >
          0
        </button>
        <button
          class="btn aspect-square bg-[#333333] active:bg-[#737373] text-white rounded-full text-2xl sm:text-3xl font-normal transition"
        >
          .
        </button>
        <button
          class="btn aspect-square bg-[#ff9f0a] active:bg-[#fbc78d] text-white rounded-full text-3xl sm:text-4xl font-normal transition"
        >
          =
        </button>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
